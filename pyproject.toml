[project]
name = "wenyuan"
version = "0.1.0"
description = "Wenyuan: a RAG service over official tech docs and learners' private notes, with an eval loop and MCP tools for the Koyo learning agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "pymilvus>=2.6.17,<2.7",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "redis>=5.2",
    "celery>=5.4",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "mcp>=1.10,<2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.26",
    "pytest>=8.3",
]

[project.scripts]
wenyuan-mcp = "app.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest"
