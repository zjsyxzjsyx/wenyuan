<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文渊</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1f2328; --muted: #6a737d; --line: #e3e1da;
    --accent: #2f6f9f; --accent-soft: #e8f0f7; --ok: #2e7d4f; --warn: #a15c00; --err: #b3261e;
    --user: #eef3f8; --private: #7a4fa0;
    --queue: #b8b8b2; --understand: #6c8ebf; --retrieve: #5aa27c; --rerank: #9a7fc4; --context: #c9a14a; --generate: #d07a5f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --panel: #1f2226; --text: #e6e6e3; --muted: #9aa0a6; --line: #30343a;
      --accent: #7fb3dd; --accent-soft: #23303b; --user: #242b33; --private: #c3a2e0; --queue: #5b5f66;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line);
           background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
  nav { display: flex; gap: 4px; }
  nav button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px;
                     padding: 6px 12px; font: inherit; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn { white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .spacer { flex: 1; }
  #account { font-size: 13px; padding: 4px 8px; max-width: 180px; }
  a { color: var(--accent); }
  main { max-width: 920px; margin: 0 auto; padding: 16px 20px 120px; }
  section[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  input[type=text], input[type=password], select, textarea {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  textarea { width: 100%; resize: vertical; min-height: 52px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--err); }
  /* chat */
  #log { display: flex; flex-direction: column; gap: 12px; }
  .msg { border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .stages { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip.done { border-color: var(--ok); color: var(--ok); }
  .answer { white-space: pre-wrap; }
  .answer code { font: 13px ui-monospace, Consolas, monospace; background: var(--bg); padding: 0 4px; border-radius: 4px; }
  .answer a.cite { text-decoration: none; font-size: 12px; vertical-align: super; }
  details { margin-top: 8px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .src { font-size: 13px; margin: 4px 0; }
  .badge { font-size: 11px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--private); color: var(--private); margin-left: 4px; }
  #composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
              padding: 10px 20px; }
  #composer .inner { max-width: 920px; margin: 0 auto; display: grid; gap: 6px; }
  /* outline */
  .tree { font-size: 14px; }
  .tree .sec { cursor: pointer; padding: 1px 0; }
  .tree .sec:hover { color: var(--accent); }
  .tree .sum { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
  /* a cited section opened in place: notes and uploaded course files have no page on the web */
  #viewer { position: fixed; inset: 6vh 8vw; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 16px 18px; z-index: 5; display: flex; flex-direction: column; }
  #viewer[hidden] { display: none; }
  #viewer pre.section { flex: 1; max-height: none; }
  pre.section { white-space: pre-wrap; font: 13px/1.55 ui-monospace, Consolas, "Microsoft YaHei", monospace;
                max-height: 60vh; overflow: auto; background: var(--bg); padding: 10px; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  /* trace */
  body.wide main { max-width: 1280px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  #tab-trace table { font-size: 13px; font-variant-numeric: tabular-nums; }
  #tab-trace td, #tab-trace th { white-space: nowrap; }
  #tab-trace th { color: var(--muted); font-weight: 500; }
  #tab-trace tbody tr { cursor: pointer; }
  #tab-trace tbody tr:hover, #tab-trace tbody tr.sel { background: var(--accent-soft); }
  .bar { display: flex; height: 10px; min-width: 240px; border-radius: 3px; overflow: hidden; background: var(--line); }
  .bar span { height: 100%; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .wf { display: grid; grid-template-columns: minmax(180px, 30%) 1fr 70px; gap: 4px 10px; align-items: center; font-size: 13px; }
  .wf .track { position: relative; height: 12px; }
  .wf .track span { position: absolute; top: 0; height: 12px; border-radius: 2px; background: var(--accent); }
  .wf .attrs { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin: -2px 0 4px; word-break: break-all; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>文渊</h1>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="ask" aria-selected="true">问答</button>
    <button role="tab" data-tab="notes">我的笔记</button>
    <button role="tab" data-tab="outline">学习目录</button>
    <button role="tab" data-tab="courses">课程</button>
    <button role="tab" data-tab="trace">看板</button>
  </nav>
  <span class="spacer"></span>
  <select id="account" title="切换账号" hidden></select>
</header>

<main>
  <!-- first run -->
  <section id="setup" hidden>
    <div class="card">
      <h2 style="margin-top:0" id="setup-title">第一次使用</h2>
      <p class="muted">起个名字就能开始。账号的 API key 只保存在这个浏览器里，可以记住多个账号，在右上角切换。
        想看知秋的请求，就把知秋配置里的 key 粘贴进来。</p>
      <div class="row">
        <input type="text" id="new-name" placeholder="名字，例如 koyo-web" maxlength="32">
        <button class="btn primary" id="create">创建账号</button>
      </div>
      <p class="muted" style="margin-top:14px">已经有 API key？</p>
      <div class="row">
        <input type="password" id="paste-key" placeholder="wy_…" style="min-width:320px">
        <button class="btn" id="use-key">使用这个 key</button>
      </div>
      <p class="err" id="setup-err"></p>
      <button class="btn" id="setup-cancel" hidden>返回</button>
    </div>
  </section>

  <!-- ask -->
  <section id="tab-ask" hidden>
    <div id="log"></div>
    <p class="muted" id="ask-empty"></p>
  </section>

  <!-- notes -->
  <section id="tab-notes" hidden>
    <div class="card">
      <div class="row">
        <input type="file" id="note-files" accept=".md,.markdown,.txt" multiple>
        <button class="btn primary" id="upload">上传到私有库</button>
      </div>
      <p class="muted">只有你能检索到这些笔记；问答里用到它们时，答案只由本地模型生成。同名文件会被覆盖。</p>
      <p id="note-msg" class="muted"></p>
    </div>
    <div class="card"><table><thead><tr><th>文件</th><th>标题</th><th>更新</th><th></th></tr></thead>
      <tbody id="note-rows"></tbody></table></div>
  </section>

  <!-- outline -->
  <section id="tab-outline" hidden>
    <div class="card row">
      <select id="ol-lib"></select>
      <input type="text" id="ol-topic" placeholder="主题，例如：持久化（可不填）" style="flex:1;min-width:200px">
      <button class="btn primary" id="ol-go">查看目录</button>
    </div>
    <div id="ol-out"></div>
    <div class="card" id="ol-section" hidden></div>
  </section>

  <!-- courses: mine, joining with a code, and a teacher's tools -->
  <section id="tab-courses" hidden>
    <div class="card">
      <div class="row">
        <input type="text" id="join-code" placeholder="老师给的邀请码，例如 join-…" style="flex:1;min-width:220px">
        <button class="btn primary" id="join">加入课程</button>
      </div>
      <p class="muted" id="course-msg"></p>
    </div>
    <div id="course-list"></div>
    <details class="card">
      <summary>开一门新课（你会成为这门课的老师）</summary>
      <div class="row" style="margin-top:8px">
        <input type="text" id="new-course-id" placeholder="课程 id，如 algo-2026" maxlength="41">
        <input type="text" id="new-course-name" placeholder="课程名称" style="flex:1;min-width:200px">
        <button class="btn" id="create-course">创建</button>
      </div>
    </details>
  </section>

  <!-- trace: the caller's own requests -->
  <section id="tab-trace" hidden>
    <p class="muted" id="tr-updated">加载中…</p>
    <p class="muted">这里只有你自己的请求。命中缓存的问答没有经过模型，不会留下记录。</p>
    <div class="stats" id="tr-cards"></div>
    <div class="card">
      <div class="legend" id="tr-legend"></div>
      <div class="scroll"><table>
        <thead><tr><th>时间</th><th>请求</th><th>总耗时</th><th>排队</th><th>各阶段</th><th>状态</th></tr></thead>
        <tbody id="tr-rows"></tbody>
      </table></div>
    </div>
    <div class="card" id="tr-detail" hidden>
      <div class="muted" id="tr-title"></div>
      <label class="muted"><input type="checkbox" id="tr-raw"> 显示技术细节（进程、模型、token 等原始字段，排查问题时用）</label>
      <div class="wf" id="tr-waterfall"></div>
    </div>
  </section>
</main>

<div id="viewer" hidden role="dialog" aria-label="引用原文">
  <div class="row"><b id="viewer-title"></b><span class="spacer"></span><span id="viewer-link"></span>
    <button class="btn" id="viewer-close">关闭</button></div>
  <pre class="section" id="viewer-text"></pre>
</div>

<div id="composer" hidden>
  <div class="inner">
    <div class="row">
      <select id="lib"><option value="">全部课程</option></select>
      <label class="muted"><input type="checkbox" id="private" checked> 包含我的笔记</label>
      <span class="spacer"></span>
      <button class="btn" id="new-chat">新对话</button>
    </div>
    <div class="row" style="flex-wrap:nowrap">
      <textarea id="q" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="btn primary" id="send">发送</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const TABS = ["ask", "notes", "outline", "courses", "trace"];
let key = store.get("wenyuan_key"), courses = [], turns = [], busy = false, current = "ask";
// Accounts this browser remembers: [{name, key}]; `key` is the one in use.
const accounts = {
  list() { try { return JSON.parse(store.get("wenyuan_accounts") || "[]"); } catch { return []; } },
  save(list) { store.set("wenyuan_accounts", JSON.stringify(list)); },
  put(name, k) {
    const list = this.list(), found = list.find(a => a.key === k);
    if (found) found.name = name; else list.push({name, key: k});
    this.save(list);
  },
  remove(k) { this.save(this.list().filter(a => a.key !== k)); },
};
if (key && !accounts.list().some(a => a.key === key)) accounts.put(store.get("wenyuan_name") || "我", key);

async function api(path, options = {}) {
  const res = await fetch(path, {...options, headers: {...(options.headers || {}), "Authorization": `Bearer ${key}`,
                                                        ...(options.body ? {"Content-Type": "application/json"} : {})}});
  if (res.ok) return res;
  let detail = {};
  try { detail = (await res.json()).detail || {}; } catch {}
  const message = typeof detail === "string" ? detail : detail.message || detail.type || `HTTP ${res.status}`;
  const retry = res.headers.get("Retry-After");
  const err = new Error(res.status === 429 ? `提问太快了，请 ${retry || "稍等"} 秒后再试`
                        : detail.type === "busy" ? `模型正忙，请 ${retry || "稍等"} 秒后再试` : message);
  err.status = res.status;
  throw err;
}

/* ---------- setup ---------- */
async function start() {
  const wanted = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get("wenyuan_tab") || "ask";
  renderAccounts();
  if (!key) return showSetup();
  try {
    const me = await (await api("/v1/me")).json();
    accounts.put(me.name, key);
    renderAccounts();
    await loadCourses();          // every time: each account has its own courses
  } catch (e) {
    if (e.status === 401) {
      accounts.remove(key); store.set("wenyuan_key", null); key = null; renderAccounts();
      return showSetup("这个 key 无效，请重新设置。");
    }
    $("ask-empty").textContent = "连不上文渊服务：" + e.message;
  }
  show(wanted);
}
function showSetup(message = "") {
  for (const id of ["tab-ask", "tab-notes", "tab-outline", "tab-courses", "tab-trace", "composer"]) $(id).hidden = true;
  stopTrace();
  $("setup").hidden = false;
  $("setup-title").textContent = accounts.list().length ? "添加账号" : "第一次使用";
  $("setup-cancel").hidden = !key;
  $("setup-err").textContent = message;
}
function renderAccounts() {
  const list = accounts.list();
  $("account").innerHTML = list.map((a, i) => `<option value="${i}">${esc(a.name)}</option>`).join("")
    + `<option value="add">＋ 添加账号</option>` + (key ? `<option value="remove">从这个浏览器移除当前账号</option>` : "");
  const i = list.findIndex(a => a.key === key);
  $("account").value = i >= 0 ? String(i) : "add";
  $("account").hidden = !list.length;
}
// Switching account starts over: the chat, the open trace and the notes belong to the old one.
function use(k) {
  key = k; store.set("wenyuan_key", k);
  turns = []; $("log").innerHTML = ""; $("ask-empty").hidden = false;
  selected = null; $("tr-detail").hidden = true; $("ol-section").hidden = true; $("course-msg").textContent = "";
  start();
}
$("account").onchange = () => {
  const v = $("account").value;
  if (v === "add") return showSetup();
  if (v === "remove") {
    if (!confirm("从这个浏览器移除当前账号？账号本身还在，以后要用需要重新粘贴它的 key。")) return renderAccounts();
    accounts.remove(key);
    const next = accounts.list()[0];
    return next ? use(next.key) : (key = null, store.set("wenyuan_key", null), renderAccounts(), showSetup());
  }
  use(accounts.list()[Number(v)].key);
};
$("setup-cancel").onclick = () => { renderAccounts(); show(current); };
$("create").onclick = async () => {
  const name = $("new-name").value.trim();
  if (!name) return;
  const res = await fetch("/ui/api/key", {method: "POST", headers: {"Content-Type": "application/json"},
                                          body: JSON.stringify({name})});
  const body = await res.json().catch(() => ({}));
  if (!res.ok) return $("setup-err").textContent = body.detail?.message || (res.status === 403
    ? "只能在运行文渊的这台电脑上创建账号；请向管理员要一个 API key。" : `创建失败（${res.status}）`);
  accounts.put(body.name, body.key);
  $("new-name").value = "";
  use(body.key);
};
$("use-key").onclick = () => {
  const value = $("paste-key").value.trim();
  if (!value) return;
  $("paste-key").value = "";
  use(value);
};

/* ---------- courses ---------- */
async function loadCourses() {
  courses = await (await api("/v1/courses")).json();
  const options = courses.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  $("lib").innerHTML = `<option value="">全部课程</option>` + options;
  $("ol-lib").innerHTML = options + `<option value="private">我的笔记</option>`;
  const saved = store.get("wenyuan_lib") || "";
  $("lib").value = courses.some(c => c.id === saved) ? saved : "";
  $("ask-empty").textContent = courses.length
    ? `问一个关于${courses.map(c => `「${c.name}」`).join("")}的问题，或你自己笔记里的内容。可以连续追问，“它 / 那个”会结合上文理解。`
    : "你还没有加入课程：到「课程」页输入老师给的邀请码。现在只能检索你自己的笔记。";
}
function renderCourses() {
  $("course-list").innerHTML = courses.length ? courses.map(c => `<div class="card" data-course="${esc(c.id)}">
      <div class="row"><b>${esc(c.name)}</b><span class="muted">${esc(c.id)}</span>
        <span class="badge">${c.role === "teacher" ? "老师" : "学生"}</span></div>
      ${c.role !== "teacher" ? "" : `
      <div class="row" style="margin-top:8px">
        <button class="btn" data-act="invite">生成邀请码</button><span data-out="invite"></span></div>
      <div class="row" style="margin-top:8px">
        <input type="file" accept=".md,.markdown" multiple data-in="files">
        <button class="btn primary" data-act="upload">上传课程资料</button><span class="muted" data-out="upload"></span></div>
      <details style="margin-top:8px"><summary data-out="count">课程资料</summary>
        <table><tbody data-out="materials"><tr><td class="muted">加载中…</td></tr></tbody></table></details>
      <details style="margin-top:8px" data-questions><summary>全班高频问题（最近 14 天）</summary>
        <p class="muted">只显示至少两位学生问过的问题，看不到是谁问的。</p>
        <div data-out="questions"></div></details>`}
    </div>`).join("") : `<p class="muted">还没有加入任何课程。</p>`;
  for (const c of courses) if (c.role === "teacher") loadMaterials(c.id);
}
const part = (id, name) => document.querySelector(`[data-course="${CSS.escape(id)}"] [data-out="${name}"]`);
// Loaded when opened: grouping embeds the questions, which costs the model server some work.
$("course-list").addEventListener("toggle", async e => {
  const box = e.target.closest("details[data-questions]");
  if (!box || !box.open) return;
  const id = box.closest("[data-course]").dataset.course, out = part(id, "questions");
  out.innerHTML = `<p class="muted">正在汇总…</p>`;
  try {
    const groups = await (await api(`/v1/courses/${encodeURIComponent(id)}/questions?days=14`)).json();
    out.innerHTML = groups.length ? `<table>${groups.map(g => `<tr><td>${esc(g.question)}${g.also.length
        ? `<div class="muted">${g.also.map(esc).join("；")}</div>` : ""}</td>
      <td class="muted">${g.students} 位学生 · ${g.asked} 次</td></tr>`).join("")}</table>`
      : `<p class="muted">最近还没有两位以上学生问过的相似问题。</p>`;
  } catch (err) { out.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}, true);
async function loadMaterials(id) {
  try {
    const docs = await (await api(`/v1/courses/${encodeURIComponent(id)}/materials`)).json();
    part(id, "count").textContent = `课程资料（${docs.length}）`;
    part(id, "materials").innerHTML = docs.length ? docs.map(d => `<tr><td>${esc(d.title)}</td>
      <td class="muted">${esc((d.updated_at || "").replace("T", " ").slice(0, 16))}</td>
      <td><button class="btn" data-act="del" data-doc="${esc(d.doc_id)}" data-name="${esc(d.title)}">删除</button></td></tr>`).join("")
      : `<tr><td class="muted">还没有资料。</td></tr>`;
  } catch (e) { part(id, "materials").innerHTML = `<tr><td class="err">${esc(e.message)}</td></tr>`; }
}
$("course-list").onclick = async e => {
  const b = e.target.closest("button[data-act]"), card = e.target.closest("[data-course]");
  if (!b || !card) return;
  const id = card.dataset.course, base = `/v1/courses/${encodeURIComponent(id)}`;
  b.disabled = true;
  try {
    if (b.dataset.act === "invite") {
      const r = await (await api(`${base}/invites`, {method: "POST", body: "{}"})).json();
      part(id, "invite").innerHTML = `邀请码 <code>${esc(r.code)}</code> <span class="muted">（只显示这一次；可用 ${esc(r.max_uses)} 次，到 ${esc(r.expires_at.replace("T", " "))} 为止）</span>`;
    }
    if (b.dataset.act === "upload") {
      const files = [...card.querySelector("[data-in=files]").files], done = [];
      for (const file of files) {
        try {
          const r = await (await api(`${base}/materials`, {method: "POST",
            body: JSON.stringify({filename: file.name, content: await file.text()})})).json();
          done.push(`${r.filename}（${r.chunks} 段）`);
        } catch (err) { done.push(`${file.name}：${err.message}`); }
      }
      part(id, "upload").textContent = files.length ? "已处理：" + done.join("；") : "先选择文件";
      card.querySelector("[data-in=files]").value = "";
      loadMaterials(id);
    }
    if (b.dataset.act === "del" && confirm(`从课程里删除“${b.dataset.name}”？全班之后都检索不到它。`)) {
      await api(`${base}/materials/${encodeURIComponent(b.dataset.doc)}`, {method: "DELETE"});
      loadMaterials(id);
    }
  } catch (err) { $("course-msg").textContent = err.message; }
  finally { b.disabled = false; }
};
$("join").onclick = async () => {
  const code = $("join-code").value.trim();
  if (!code) return;
  try {
    const c = await (await api("/v1/courses/join", {method: "POST", body: JSON.stringify({code})})).json();
    $("course-msg").textContent = `已加入「${c.name}」`; $("join-code").value = "";
    await loadCourses(); renderCourses();
  } catch (e) { $("course-msg").textContent = e.message; }

$("create-course").onclick = async () => {

  if (!id || !name) return;

/* ---------- tabs ---------- */
function show(tab) {
  if (!key) return showSetup();
  $("setup").hidden = true;
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", b.dataset.tab === tab);
  for (const name of TABS) $(`tab-${name}`).hidden = name !== tab;
  $("composer").hidden = tab !== "ask";
  document.body.classList.toggle("wide", tab === "trace");
  store.set("wenyuan_tab", tab); current = tab;
  history.replaceState(null, "", `#${tab}`);
  if (tab === "notes") loadNotes();
  if (tab === "courses") loadCourses().then(renderCourses).catch(e => $("course-msg").textContent = e.message);
  if (tab === "ask") $("q").focus();
  if (tab === "trace") startTrace(); else stopTrace();
}
$("tabs").onclick = e => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab); };
window.addEventListener("hashchange", () => { const tab = location.hash.slice(1); if (TABS.includes(tab)) show(tab); });

/* ---------- ask ---------- */
function bubble(cls, html) {
  $("ask-empty").hidden = true;
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.innerHTML = html;
  $("log").appendChild(div);
  div.scrollIntoView({block: "end", behavior: "smooth"});
  return div;
}
// Where a citation leads: the exact place on the web (a notes anchor, a second of the lecture video)
// when the original has one, else the cited section opened here (notes, uploaded course files).
function citeLink(c, label, cls = "") {
  const title = `${c.title} › ${c.heading_path}`;
  if (/^https?:/.test(c.url || "")) return `<a class="${cls}" href="${esc(c.url)}" target="_blank" title="${esc(title)}">${label}</a>`;
  if (c.section_id) return `<a class="${cls}" href="#" data-section="${esc(c.section_id)}" title="${esc(title)}">${label}</a>`;
  return label;
}
function linkCitations(text, citations) {
  const by = Object.fromEntries((citations || []).map(c => [c.sid, c]));
  return esc(text).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\[(S\d+)\]/g,
    (m, sid) => by[sid] ? citeLink(by[sid], `[${sid}]`, "cite") : m);
}
function sourceList(sources) {
  return sources.map(s => `<div class="src">[${esc(s.sid)}] ${citeLink(s, esc(s.title))} › ${esc(s.heading_path)}${
    s.private ? '<span class="badge">我的笔记</span>' : ""}</div>`).join("");
}
async function openSection(id) {
  $("viewer").hidden = false; $("viewer-title").textContent = "正在加载…"; $("viewer-text").textContent = ""; $("viewer-link").innerHTML = "";
  try {
    const s = await (await api(`/v1/sections/${encodeURIComponent(id)}`)).json();
    $("viewer-title").textContent = s.heading_path;
    $("viewer-text").textContent = s.text + (s.truncated ? "\n\n……（太长，只显示了开头）" : "");
    if (/^https?:/.test(s.url)) $("viewer-link").innerHTML = `<a href="${esc(s.url)}" target="_blank" class="muted">原文 ↗</a>`;
  } catch (e) { $("viewer-title").textContent = e.message; }
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-section]");
  if (a) { e.preventDefault(); openSection(a.dataset.section); }
});
$("viewer-close").onclick = () => { $("viewer").hidden = true; };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("viewer").hidden = true; });

async function ask() {
  const question = $("q").value.trim();
  if (!question || busy) return;
  busy = true; $("send").disabled = true; $("q").value = "";
  bubble("user", esc(question));
  const out = bubble("bot", `<div class="stages"><span class="chip on" data-s="understanding">理解问题</span>
    <span class="chip" data-s="sources">查找资料</span><span class="chip" data-s="done">生成并校验答案</span></div>
    <div class="answer muted">…</div>`);
  const chip = (name, state) => { const c = out.querySelector(`[data-s="${name}"]`); if (c) c.className = `chip ${state}`; };
  const body = {question, history: turns.slice(-6), include_private: $("private").checked, stream: true,
                libraries: $("lib").value ? [$("lib").value] : null};
  let sources = [], answered = null, understood = null;
  try {
    const res = await api("/v1/ask", {method: "POST", body: JSON.stringify(body)});
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
        const event = (block.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((block.match(/^data: (.*)$/m) || [, "null"])[1]);
        if (event === "queued") out.querySelector(".answer").textContent = `排队中，前面还有 ${data.position} 个问题…`;
        if (event === "understanding") {
          chip("understanding", "done"); chip("sources", "on"); understood = data.standalone_question;
          const apis = (data.candidate_apis || []).length ? `，相关：${data.candidate_apis.join(", ")}` : "";
          out.querySelector(".answer").textContent = `理解为：${data.standalone_question}${apis}`;
        }
        if (event === "sources") { sources = data.sources; chip("sources", "done"); chip("done", "on");
          out.querySelector(".answer").textContent = `找到 ${sources.length} 段资料，正在生成答案…`; }
        if (event === "done") answered = data;
        if (event === "error") throw Object.assign(new Error(data.type === "busy"
          ? `模型正忙，请 ${data.retry_after_s || "稍等"} 秒后再试` : data.message || data.type), {});
      }
    }
    if (!answered) throw new Error("连接中断了，请重试");
    chip("done", "done");
    const a = answered.answer, v = a.verification;
    const note = [answered.cached === "hit" ? "来自缓存" : "", v && v.removed.length ? `已删去 ${v.removed.length} 句无出处的内容` : ""]
      .filter(Boolean).join(" · ");
    out.querySelector(".answer").className = "answer";
    const asked = understood && understood !== question ? `<div class="muted">理解为：${esc(understood)}</div>` : "";
    out.querySelector(".answer").innerHTML = asked + linkCitations(a.text, a.citations) +
      (note ? `<div class="muted" style="margin-top:6px">${esc(note)}</div>` : "") +
      (sources.length ? `<details><summary>参考资料（${sources.length}）</summary>${sourceList(sources)}</details>` : "");
    turns.push({role: "user", content: question}, {role: "assistant", content: a.text});
  } catch (e) {
    out.querySelector(".answer").innerHTML = `<span class="err">${esc(e.message)}</span>`;
    if (e.status === 401) { accounts.remove(key); store.set("wenyuan_key", null); key = null; renderAccounts();
                            showSetup("key 已失效，请重新设置。"); }
  } finally {
    busy = false; $("send").disabled = false; $("q").focus();
  }
}
$("send").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });
$("new-chat").onclick = () => { turns = []; $("log").innerHTML = ""; $("ask-empty").hidden = false; $("q").focus(); };
$("lib").onchange = () => store.set("wenyuan_lib", $("lib").value);

/* ---------- notes ---------- */
async function loadNotes() {
  try {
    const notes = await (await api("/v1/notes")).json();
    $("note-rows").innerHTML = notes.length ? notes.map(n => `<tr><td>${esc(n.filename)}</td><td>${esc(n.title)}</td>
      <td class="muted">${esc((n.updated_at || "").replace("T", " ").slice(0, 16))}</td>
      <td><button class="btn" data-del="${esc(n.doc_id)}" data-name="${esc(n.filename)}">删除</button></td></tr>`).join("")
      : `<tr><td colspan="4" class="muted">还没有笔记。</td></tr>`;
  } catch (e) { $("note-msg").textContent = e.message; }
}
$("upload").onclick = async () => {
  const files = [...$("note-files").files];
  if (!files.length) return;
  $("upload").disabled = true;
  const done = [];

    try {
      const r = await (await api("/v1/notes", {method: "POST",
        body: JSON.stringify({filename: file.name, content: await file.text()})})).json();
      done.push(`${r.filename}（${r.chunks} 段）`);
    } catch (e) { done.push(`${file.name}：${e.message}`); }

  $("upload").disabled = false; $("note-files").value = "";

};
$("note-rows").onclick = async e => {
  const b = e.target.closest("button[data-del]");
  if (!b || !confirm(`删除笔记“${b.dataset.name}”？之后的问答将检索不到它。`)) return;
  try { await api(`/v1/notes/${encodeURIComponent(b.dataset.del)}`, {method: "DELETE"}); loadNotes(); }
  catch (err) { $("note-msg").textContent = err.message; }
};

/* ---------- outline ---------- */

/* ---------- trace: my own requests ---------- */
const STAGES = ["understand", "retrieve", "rerank", "context", "generate"];
const SPAN_STAGE = {query_understanding: "understand", hybrid_search: "retrieve", dense_search: "retrieve",
                    rerank: "rerank", small_to_big: "context", answer: "generate"};
const color = name => `var(--${name})`;
const ms = v => v == null ? "–" : v >= 1000 ? (v / 1000).toFixed(1) + " s" : Math.round(v) + " ms";
let selected = null, traceTimer = null;
// What a learner reads; the raw span names and attributes stay behind "显示技术细节".
const STAGE_LABEL = {queue: "排队", understand: "理解问题", retrieve: "检索", rerank: "重排",
                     context: "整理资料", generate: "生成答案"};
const SPAN_LABEL = {
  "POST /v1/ask": "收到提问", "POST /v1/search": "收到检索请求", ask: "问答", search: "检索",
  query_understanding: "理解问题", hybrid_search: "检索资料", dense_search: "检索资料",
  multihop_decompose: "拆成子问题再检索", multihop_iterative: "多轮检索", rerank: "重排",
  small_to_big: "整理资料", answer: "生成答案", verify_claims: "逐句校验", hyde: "写假想答案",
  file_question: "记录提问（给老师的汇总）", "GET /v1/outline": "查学习目录", "GET /v1/sections": "看章节原文",
  "POST /v1/notes": "上传笔记", "GET /v1/notes": "列出笔记", "DELETE /v1/notes": "删除笔记",
  "POST /v1/courses": "开课", "POST /v1/courses/join": "加入课程", "POST /v1/courses/materials": "上传课程资料",
  "DELETE /v1/courses/materials": "删除课程资料", "GET /v1/courses/questions": "查看高频问题",
};
const STATUS_LABEL = {ok: "完成", error: "出错", running: "进行中", interrupted: "中断"};
const stageLabel = s => STAGE_LABEL[s] ?? s;
const spanLabel = name => SPAN_LABEL[name] ?? name;
function friendly(s) {
  const a = s.attrs || {}, out = [];
  if (a.queued_s > 0.05) out.push(`排队 ${a.queued_s.toFixed(1)} 秒`);
  if (a.llm_cache === "hit") out.push("用了之前算过的结果，没有调用模型");
  if (Array.isArray(a.candidate_apis) && a.candidate_apis.length) out.push(`推断的术语：${a.candidate_apis.join("、")}`);
  if (a.hits != null) out.push(`找到 ${a.hits} 个片段`);
  if (a.sources != null && s.name !== "answer") out.push(`交给模型 ${a.sources} 段资料`);
  if (a.supported != null) out.push(`校验 ${a.supported + (a.partial || 0) + (a.unsupported || 0)} 句，删掉 ${a.removed ?? a.unsupported ?? 0} 句`);
  if (s.kind === "request" && a.found === false) out.push("资料里没有，已拒答");
  if (s.kind === "request" && a.found === true) out.push(`已回答，引用 ${a.citations ?? 0} 处`);
  if (a.private_context) out.push("用到了你的笔记，只用本地模型");
  if (a.error) out.push(`出错：${a.error}`);
  return out.join(" · ");
}

$("tr-legend").innerHTML = ["queue", ...STAGES].map(s => `<span><i style="background:${color(s)}"></i>${stageLabel(s)}</span>`).join("");
function stat(label, value, sub = "") {
  return `<div class="stat"><span class="muted">${label}</span><b>${value}</b><span class="muted">${sub}</span></div>`;
}
function stageBar(r) {
  const total = Math.max(r.duration_ms || 1, 1);
  const parts = [["queue", r.queued_ms], ...STAGES.map(s => [s, r.stages[s] || 0])];
  return `<div class="bar">${parts.filter(([, v]) => v > 0)
    .map(([s, v]) => `<span title="${stageLabel(s)} ${ms(v)}" style="width:${100 * v / total}%;background:${color(s)}"></span>`)
    .join("")}</div>`;
}
async function refreshTrace() {
  let summary;
  try { summary = await (await api("/v1/traces")).json(); }
  catch (e) { $("tr-updated").textContent = e.message; return; }
  const {stats, live, requests} = summary;
  $("tr-cards").innerHTML = [
    stat("我的请求", stats.requests, `${stats.errors} 个出错`),
    stat("总耗时 p50", ms(stats.total_ms.p50), `p95 ${ms(stats.total_ms.p95)}`),
    stat("排队 p95", ms(stats.queued_ms.p95), "等 GPU 槽位"),
    ...STAGES.filter(s => stats.stages_ms[s].p50 != null)
      .map(s => stat(`${stageLabel(s)} p50`, ms(stats.stages_ms[s].p50), `p95 ${ms(stats.stages_ms[s].p95)}`)),
    stat("GPU 现在", `${live.gate_in_use ?? "–"} / ${live.gate_slots ?? "–"}`, "占用 / 槽位（所有人）"),
  ].join("");
  $("tr-rows").innerHTML = requests.map(r => `
    <tr data-trace="${esc(r.trace_id)}" class="${r.trace_id === selected ? "sel" : ""}">
      <td>${new Date(r.started_ns / 1e6).toLocaleTimeString()}</td><td>${esc(spanLabel(r.name))}</td>
      <td>${ms(r.duration_ms)}</td><td>${ms(r.queued_ms)}</td>
      <td>${stageBar(r)}</td>
      <td class="${r.status === "error" ? "err" : ""}">${esc(STATUS_LABEL[r.status] ?? r.status)}${r.error ? " · " + esc(r.error) : ""}</td>
    </tr>`).join("");
  $("tr-updated").textContent = `更新于 ${new Date().toLocaleTimeString()} · 每 5 秒刷新 · 点一行看每一步花了多久`;
}
function startTrace() { refreshTrace(); traceTimer ??= setInterval(refreshTrace, 5000); }
function stopTrace() { clearInterval(traceTimer); traceTimer = null; }
let shownSpans = null;
async function showTrace(traceId) {
  selected = traceId;
  shownSpans = await (await api(`/v1/traces/${encodeURIComponent(traceId)}`)).json();
  renderTrace(traceId, shownSpans);
  refreshTrace();
}
function renderTrace(traceId, spans) {
  const raw = $("tr-raw").checked;
  const start = Math.min(...spans.map(s => s.started_at_ns));
  const end = Math.max(...spans.map(s => s.started_at_ns + (s.duration_ms || 0) * 1e6));
  const span = Math.max(end - start, 1);
  const depth = {}, byId = Object.fromEntries(spans.map(s => [s.span_id, s]));
  const level = s => depth[s.span_id] ??= s.parent_span_id && byId[s.parent_span_id] ? level(byId[s.parent_span_id]) + 1 : 0;
  $("tr-detail").hidden = false;
  $("tr-title").textContent = raw ? `trace ${traceId} · ${ms(span / 1e6)}` : `这次请求共 ${ms(span / 1e6)}，每一步如下`;
  $("tr-waterfall").innerHTML = spans.map(s => {
    const left = 100 * (s.started_at_ns - start) / span, width = Math.max(0.4, 100 * (s.duration_ms || 0) * 1e6 / span);
    const note = raw
      ? Object.entries(s.attrs).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join("  ")
      : friendly(s);
    const name = raw ? `${s.kind} · ${s.name}` : spanLabel(s.name);
    const fill = SPAN_STAGE[s.name] ? color(SPAN_STAGE[s.name]) : "var(--accent)";
    return `<div style="padding-left:${level(s) * 14}px" class="${s.status === "error" ? "err" : ""}">${esc(name)}</div>
      <div class="track"><span style="left:${left}%;width:${width}%;background:${fill}"></span></div>
      <div>${ms(s.duration_ms)}</div>
      ${note ? `<div class="attrs">${esc(note)}</div>` : ""}`;
  }).join("");
}
$("tr-raw").onchange = () => { if (shownSpans) renderTrace(selected, shownSpans); };
$("tr-rows").onclick = e => { const row = e.target.closest("tr[data-trace]"); if (row) showTrace(row.dataset.trace); };
start();
</script>
