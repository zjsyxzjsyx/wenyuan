<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文渊</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1f2328; --muted: #6a737d; --line: #e3e1da;
    --accent: #2f6f9f; --accent-soft: #e8f0f7; --ok: #2e7d4f; --warn: #a15c00; --err: #b3261e;
    --user: #eef3f8; --private: #7a4fa0;
    --queue: #b8b8b2; --understand: #6c8ebf; --retrieve: #5aa27c; --rerank: #9a7fc4; --context: #c9a14a; --generate: #d07a5f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --panel: #1f2226; --text: #e6e6e3; --muted: #9aa0a6; --line: #30343a;
      --accent: #7fb3dd; --accent-soft: #23303b; --user: #242b33; --private: #c3a2e0; --queue: #5b5f66;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line);
           background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
  nav { display: flex; gap: 4px; }
  nav button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px;
                     padding: 6px 12px; font: inherit; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn { white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .spacer { flex: 1; }
  .who { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  main { max-width: 920px; margin: 0 auto; padding: 16px 20px 120px; }
  section[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  input[type=text], input[type=password], select, textarea {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  textarea { width: 100%; resize: vertical; min-height: 52px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--err); }
  /* chat */
  #log { display: flex; flex-direction: column; gap: 12px; }
  .msg { border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .stages { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip.done { border-color: var(--ok); color: var(--ok); }
  .answer { white-space: pre-wrap; }
  .answer code { font: 13px ui-monospace, Consolas, monospace; background: var(--bg); padding: 0 4px; border-radius: 4px; }
  .answer a.cite { text-decoration: none; font-size: 12px; vertical-align: super; }
  details { margin-top: 8px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .src { font-size: 13px; margin: 4px 0; }
  .badge { font-size: 11px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--private); color: var(--private); margin-left: 4px; }
  #composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
              padding: 10px 20px; }
  #composer .inner { max-width: 920px; margin: 0 auto; display: grid; gap: 6px; }
  /* outline */
  .tree { font-size: 14px; }
  .tree .sec { cursor: pointer; padding: 1px 0; }
  .tree .sec:hover { color: var(--accent); }
  .tree .sum { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
  pre.section { white-space: pre-wrap; font: 13px/1.55 ui-monospace, Consolas, "Microsoft YaHei", monospace;
                max-height: 60vh; overflow: auto; background: var(--bg); padding: 10px; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  /* trace */
  body.wide main { max-width: 1280px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  #tab-trace table { font-size: 13px; font-variant-numeric: tabular-nums; }
  #tab-trace td, #tab-trace th { white-space: nowrap; }
  #tab-trace th { color: var(--muted); font-weight: 500; }
  #tab-trace tbody tr { cursor: pointer; }
  #tab-trace tbody tr:hover, #tab-trace tbody tr.sel { background: var(--accent-soft); }
  .bar { display: flex; height: 10px; min-width: 240px; border-radius: 3px; overflow: hidden; background: var(--line); }
  .bar span { height: 100%; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .wf { display: grid; grid-template-columns: minmax(180px, 30%) 1fr 70px; gap: 4px 10px; align-items: center; font-size: 13px; }
  .wf .track { position: relative; height: 12px; }
  .wf .track span { position: absolute; top: 0; height: 12px; border-radius: 2px; background: var(--accent); }
  .wf .attrs { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin: -2px 0 4px; word-break: break-all; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>文渊</h1>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="ask" aria-selected="true">问答</button>
    <button role="tab" data-tab="notes">我的笔记</button>
    <button role="tab" data-tab="outline">学习目录</button>
    <button role="tab" data-tab="trace" id="trace-tab">看板</button>
  </nav>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
</header>

<main>
  <!-- first run -->
  <section id="setup" hidden>
    <div class="card">
      <h2 style="margin-top:0">第一次使用</h2>
      <p class="muted">起个名字就能开始。账号的 API key 只保存在这个浏览器里；换浏览器时，可以把它复制过去。</p>
      <div class="row">
        <input type="text" id="new-name" placeholder="名字，例如 koyo-web" maxlength="32">
        <button class="btn primary" id="create">创建账号</button>
      </div>
      <p class="muted" style="margin-top:14px">已经有 API key？</p>
      <div class="row">
        <input type="password" id="paste-key" placeholder="wy_…" style="min-width:320px">
        <button class="btn" id="use-key">使用这个 key</button>
      </div>
      <p class="err" id="setup-err"></p>
    </div>
  </section>

  <!-- ask -->
  <section id="tab-ask" hidden>
    <div id="log"></div>
    <p class="muted" id="ask-empty">问一个关于 Python、Redis、PostgreSQL、Django、FastAPI、Docker、PyTorch 等官方文档的问题，或你自己笔记里的内容。可以连续追问，“它 / 那个”会结合上文理解。</p>
  </section>

  <!-- notes -->
  <section id="tab-notes" hidden>
    <div class="card">
      <div class="row">
        <input type="file" id="note-files" accept=".md,.markdown,.txt" multiple>
        <button class="btn primary" id="upload">上传到私有库</button>
      </div>
      <p class="muted">只有你能检索到这些笔记；问答里用到它们时，答案只由本地模型生成。同名文件会被覆盖。</p>
      <p id="note-msg" class="muted"></p>
    </div>
    <div class="card"><table><thead><tr><th>文件</th><th>标题</th><th>更新</th><th></th></tr></thead>
      <tbody id="note-rows"></tbody></table></div>
  </section>

  <!-- outline -->
  <section id="tab-outline" hidden>
    <div class="card row">
      <select id="ol-lib"></select>
      <input type="text" id="ol-topic" placeholder="主题，例如：持久化（可不填）" style="flex:1;min-width:200px">
      <button class="btn primary" id="ol-go">查看目录</button>
    </div>
    <div id="ol-out"></div>
    <div class="card" id="ol-section" hidden></div>
  </section>

  <!-- trace: every request's stages, only for this machine -->
  <section id="tab-trace" hidden>
    <p class="muted" id="tr-updated">加载中…</p>
    <div class="stats" id="tr-cards"></div>
    <div class="card">
      <div class="legend" id="tr-legend"></div>
      <div class="scroll"><table>
        <thead><tr><th>时间</th><th>请求</th><th>用户</th><th>总耗时</th><th>排队</th><th>各阶段</th><th>状态</th></tr></thead>
        <tbody id="tr-rows"></tbody>
      </table></div>
    </div>
    <div class="card" id="tr-detail" hidden>
      <div class="muted" id="tr-title"></div>
      <div class="wf" id="tr-waterfall"></div>
    </div>
  </section>
</main>

<div id="composer" hidden>
  <div class="inner">
    <div class="row">
      <select id="lib"><option value="">全部文档库</option></select>
      <label class="muted"><input type="checkbox" id="private" checked> 包含我的笔记</label>
      <span class="spacer"></span>
      <button class="btn" id="new-chat">新对话</button>
    </div>
    <div class="row" style="flex-wrap:nowrap">
      <textarea id="q" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="btn primary" id="send">发送</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const TABS = ["ask", "notes", "outline", "trace"];
let key = store.get("wenyuan_key"), libraries = [], turns = [], busy = false;

async function api(path, options = {}) {
  const res = await fetch(path, {...options, headers: {...(options.headers || {}), "Authorization": `Bearer ${key}`,
                                                        ...(options.body ? {"Content-Type": "application/json"} : {})}});
  if (res.ok) return res;
  let detail = {};
  try { detail = (await res.json()).detail || {}; } catch {}
  const message = typeof detail === "string" ? detail : detail.message || detail.type || `HTTP ${res.status}`;
  const retry = res.headers.get("Retry-After");
  const err = new Error(res.status === 429 ? `提问太快了，请 ${retry || "稍等"} 秒后再试`
                        : detail.type === "busy" ? `模型正忙，请 ${retry || "稍等"} 秒后再试` : message);
  err.status = res.status;
  throw err;
}

/* ---------- setup ---------- */
async function start() {
  const wanted = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get("wenyuan_tab") || "ask";
  if (!key) return wanted === "trace" ? show("trace") : showSetup();
  try {
    libraries = await (await api("/v1/libraries")).json();
  } catch (e) {
    if (e.status === 401) { store.set("wenyuan_key", null); key = null; return showSetup("这个 key 无效，请重新设置。"); }
    $("ask-empty").textContent = "连不上文渊服务：" + e.message;
  }
  $("setup").hidden = true;
  $("who").textContent = store.get("wenyuan_name") ? `你好，${store.get("wenyuan_name")}` : "";
  for (const sel of [$("lib"), $("ol-lib")]) {
    sel.insertAdjacentHTML("beforeend", libraries.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join(""));
  }
  $("ol-lib").insertAdjacentHTML("beforeend", `<option value="private">我的笔记</option>`);
  $("lib").value = store.get("wenyuan_lib") || "";
  show(wanted);
}
function showSetup(message = "") {
  for (const id of ["tab-ask", "tab-notes", "tab-outline", "tab-trace", "composer"]) $(id).hidden = true;
  stopTrace();
  $("setup").hidden = false;
  $("setup-err").textContent = message;
}
$("create").onclick = async () => {
  const name = $("new-name").value.trim();
  if (!name) return;
  const res = await fetch("/ui/api/key", {method: "POST", headers: {"Content-Type": "application/json"},
                                          body: JSON.stringify({name})});
  const body = await res.json().catch(() => ({}));
  if (!res.ok) return $("setup-err").textContent = body.detail?.message || (res.status === 403
    ? "只能在运行文渊的这台电脑上创建账号；请向管理员要一个 API key。" : `创建失败（${res.status}）`);
  key = body.key; store.set("wenyuan_key", key); store.set("wenyuan_name", body.name);
  start();
};
$("use-key").onclick = () => {
  const value = $("paste-key").value.trim();
  if (!value) return;
  key = value; store.set("wenyuan_key", key); start();
};

/* ---------- tabs ---------- */
function show(tab) {
  if (!key && tab !== "trace") return showSetup();
  $("setup").hidden = true;
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", b.dataset.tab === tab);
  for (const name of TABS) $(`tab-${name}`).hidden = name !== tab;
  $("composer").hidden = tab !== "ask";
  document.body.classList.toggle("wide", tab === "trace");
  store.set("wenyuan_tab", tab);
  history.replaceState(null, "", `#${tab}`);
  if (tab === "notes") loadNotes();
  if (tab === "ask") $("q").focus();
  if (tab === "trace") startTrace(); else stopTrace();
}
$("tabs").onclick = e => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab); };

/* ---------- ask ---------- */
function bubble(cls, html) {
  $("ask-empty").hidden = true;
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.innerHTML = html;
  $("log").appendChild(div);
  div.scrollIntoView({block: "end", behavior: "smooth"});
  return div;
}
function linkCitations(text, citations) {
  const by = Object.fromEntries((citations || []).map(c => [c.sid, c]));
  return esc(text).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\[(S\d+)\]/g, (m, sid) => by[sid]
    ? `<a class="cite" href="${esc(by[sid].url)}" target="_blank" title="${esc(by[sid].title)} › ${esc(by[sid].heading_path)}">[${sid}]</a>` : m);
}
function sourceList(sources) {
  return sources.map(s => {
    const link = s.private ? esc(s.title) : `<a href="${esc(s.url)}" target="_blank">${esc(s.title)}</a>`;
    return `<div class="src">[${esc(s.sid)}] ${link} › ${esc(s.heading_path)}${s.private ? '<span class="badge">我的笔记</span>' : ""}</div>`;
  }).join("");
}

async function ask() {
  const question = $("q").value.trim();
  if (!question || busy) return;
  busy = true; $("send").disabled = true; $("q").value = "";
  bubble("user", esc(question));
  const out = bubble("bot", `<div class="stages"><span class="chip on" data-s="understanding">理解问题</span>
    <span class="chip" data-s="sources">查找资料</span><span class="chip" data-s="done">生成并校验答案</span></div>
    <div class="answer muted">…</div>`);
  const chip = (name, state) => { const c = out.querySelector(`[data-s="${name}"]`); if (c) c.className = `chip ${state}`; };
  const body = {question, history: turns.slice(-6), include_private: $("private").checked, stream: true,
                libraries: $("lib").value ? [$("lib").value] : null};
  let sources = [], answered = null, understood = null;
  try {
    const res = await api("/v1/ask", {method: "POST", body: JSON.stringify(body)});
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
        const event = (block.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((block.match(/^data: (.*)$/m) || [, "null"])[1]);
        if (event === "queued") out.querySelector(".answer").textContent = `排队中，前面还有 ${data.position} 个问题…`;
        if (event === "understanding") {
          chip("understanding", "done"); chip("sources", "on"); understood = data.standalone_question;
          const apis = (data.candidate_apis || []).length ? `，相关：${data.candidate_apis.join(", ")}` : "";
          out.querySelector(".answer").textContent = `理解为：${data.standalone_question}${apis}`;
        }
        if (event === "sources") { sources = data.sources; chip("sources", "done"); chip("done", "on");
          out.querySelector(".answer").textContent = `找到 ${sources.length} 段资料，正在生成答案…`; }
        if (event === "done") answered = data;
        if (event === "error") throw Object.assign(new Error(data.type === "busy"
          ? `模型正忙，请 ${data.retry_after_s || "稍等"} 秒后再试` : data.message || data.type), {});
      }
    }
    if (!answered) throw new Error("连接中断了，请重试");
    chip("done", "done");
    const a = answered.answer, v = a.verification;
    const note = [answered.cached === "hit" ? "来自缓存" : "", v && v.removed.length ? `已删去 ${v.removed.length} 句无出处的内容` : ""]
      .filter(Boolean).join(" · ");
    out.querySelector(".answer").className = "answer";
    const asked = understood && understood !== question ? `<div class="muted">理解为：${esc(understood)}</div>` : "";
    out.querySelector(".answer").innerHTML = asked + linkCitations(a.text, a.citations) +
      (note ? `<div class="muted" style="margin-top:6px">${esc(note)}</div>` : "") +
      (sources.length ? `<details><summary>参考资料（${sources.length}）</summary>${sourceList(sources)}</details>` : "");
    turns.push({role: "user", content: question}, {role: "assistant", content: a.text});
  } catch (e) {
    out.querySelector(".answer").innerHTML = `<span class="err">${esc(e.message)}</span>`;
    if (e.status === 401) { store.set("wenyuan_key", null); key = null; showSetup("key 已失效，请重新设置。"); }
  } finally {
    busy = false; $("send").disabled = false; $("q").focus();
  }
}
$("send").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });
$("new-chat").onclick = () => { turns = []; $("log").innerHTML = ""; $("ask-empty").hidden = false; $("q").focus(); };
$("lib").onchange = () => store.set("wenyuan_lib", $("lib").value);

/* ---------- notes ---------- */
async function loadNotes() {
  try {
    const notes = await (await api("/v1/notes")).json();
    $("note-rows").innerHTML = notes.length ? notes.map(n => `<tr><td>${esc(n.filename)}</td><td>${esc(n.title)}</td>
      <td class="muted">${esc((n.updated_at || "").replace("T", " ").slice(0, 16))}</td>
      <td><button class="btn" data-del="${esc(n.doc_id)}" data-name="${esc(n.filename)}">删除</button></td></tr>`).join("")
      : `<tr><td colspan="4" class="muted">还没有笔记。</td></tr>`;
  } catch (e) { $("note-msg").textContent = e.message; }
}
$("upload").onclick = async () => {
  const files = [...$("note-files").files];
  if (!files.length) return;
  $("upload").disabled = true;
  const done = [];
  for (const file of files) {
    try {
      const r = await (await api("/v1/notes", {method: "POST",
        body: JSON.stringify({filename: file.name, content: await file.text()})})).json();
      done.push(`${r.filename}（${r.chunks} 段）`);
    } catch (e) { done.push(`${file.name}：${e.message}`); }
  }
  $("note-msg").textContent = "已处理：" + done.join("；");
  $("upload").disabled = false; $("note-files").value = "";
  loadNotes();
};
$("note-rows").onclick = async e => {
  const b = e.target.closest("button[data-del]");
  if (!b || !confirm(`删除笔记“${b.dataset.name}”？之后的问答将检索不到它。`)) return;
  try { await api(`/v1/notes/${encodeURIComponent(b.dataset.del)}`, {method: "DELETE"}); loadNotes(); }
  catch (err) { $("note-msg").textContent = err.message; }
};

/* ---------- outline ---------- */
$("ol-go").onclick = async () => {
  const params = new URLSearchParams({library: $("ol-lib").value});
  if ($("ol-topic").value.trim()) params.set("topic", $("ol-topic").value.trim());
  $("ol-out").innerHTML = `<p class="muted">正在查找…</p>`; $("ol-section").hidden = true;
  try {
    const docs = await (await api(`/v1/outline?${params}`)).json();
    $("ol-out").innerHTML = docs.length ? docs.map(d => `<div class="card tree">
        <div><b>${esc(d.title)}</b> ${d.url.startsWith("private://") ? '<span class="badge">我的笔记</span>'
          : `<a href="${esc(d.url)}" target="_blank" class="muted">原文 ↗</a>`}</div>
        ${d.sections.map(s => `<div class="sec" data-id="${esc(s.section_id)}" style="padding-left:${(s.level - 1) * 16}px">· ${esc(s.heading)}</div>
          ${s.summary ? `<div class="sum" style="padding-left:${(s.level - 1) * 16 + 12}px">${esc(s.summary)}</div>` : ""}`).join("")}
      </div>`).join("") : `<p class="muted">没有找到相关章节。</p>`;
  } catch (e) { $("ol-out").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
};
$("ol-topic").addEventListener("keydown", e => { if (e.key === "Enter") $("ol-go").click(); });
$("ol-out").onclick = async e => {
  const sec = e.target.closest(".sec[data-id]");
  if (!sec) return;
  const box = $("ol-section");
  sec.closest(".card").after(box);
  box.hidden = false; box.innerHTML = `<p class="muted">正在加载…</p>`;
  try {
    const s = await (await api(`/v1/sections/${encodeURIComponent(sec.dataset.id)}`)).json();
    box.innerHTML = `<div><b>${esc(s.heading_path)}</b> ${s.url.startsWith("private://") ? ""
      : `<a href="${esc(s.url)}" target="_blank" class="muted">原文 ↗</a>`}</div><pre class="section">${esc(s.text)}</pre>`;
    box.scrollIntoView({behavior: "smooth"});
  } catch (err) { box.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
};

/* ---------- trace (the API under /dashboard answers only this machine) ---------- */
const STAGES = ["understand", "retrieve", "rerank", "context", "generate"];
const SPAN_STAGE = {query_understanding: "understand", hybrid_search: "retrieve", dense_search: "retrieve",
                    rerank: "rerank", small_to_big: "context", answer: "generate"};
const color = name => `var(--${name})`;
const ms = v => v == null ? "–" : v >= 1000 ? (v / 1000).toFixed(1) + " s" : Math.round(v) + " ms";
let selected = null, traceTimer = null;

$("tr-legend").innerHTML = ["queue", ...STAGES].map(s => `<span><i style="background:${color(s)}"></i>${s}</span>`).join("");
function stat(label, value, sub = "") {
  return `<div class="stat"><span class="muted">${label}</span><b>${value}</b><span class="muted">${sub}</span></div>`;
}
function stageBar(r) {
  const total = Math.max(r.duration_ms || 1, 1);
  const parts = [["queue", r.queued_ms], ...STAGES.map(s => [s, r.stages[s] || 0])];
  return `<div class="bar">${parts.filter(([, v]) => v > 0)
    .map(([s, v]) => `<span title="${s} ${ms(v)}" style="width:${100 * v / total}%;background:${color(s)}"></span>`)
    .join("")}</div>`;
}
async function refreshTrace() {
  const res = await fetch("/dashboard/api/summary", {cache: "no-store"}).catch(() => null);
  if (!res || !res.ok) {
    $("tr-updated").textContent = res && res.status === 403 ? "看板只对运行文渊的这台电脑开放。" : "连不上文渊服务";
    return;
  }
  const {stats, live, requests} = await res.json();
  const cache = live.cache || {};
  const served = (cache.hit || 0) + (cache.shared || 0), all = served + (cache.miss || 0);
  $("tr-cards").innerHTML = [
    stat("请求数", stats.requests, `${stats.errors} 个出错`),
    stat("总耗时 p50", ms(stats.total_ms.p50), `p95 ${ms(stats.total_ms.p95)}`),
    stat("排队 p95", ms(stats.queued_ms.p95), "等 GPU 槽位"),
    ...STAGES.filter(s => stats.stages_ms[s].p50 != null)
      .map(s => stat(`${s} p50`, ms(stats.stages_ms[s].p50), `p95 ${ms(stats.stages_ms[s].p95)}`)),
    stat("GPU 闸门", `${live.gate_in_use ?? "–"} / ${live.gate_slots ?? "–"}`, "占用 / 槽位"),
    stat("问答缓存", all ? `${Math.round(100 * served / all)}%` : "–",
         `hit ${cache.hit || 0} · shared ${cache.shared || 0} · miss ${cache.miss || 0}`),
  ].join("");
  $("tr-rows").innerHTML = requests.map(r => `
    <tr data-trace="${esc(r.trace_id)}" class="${r.trace_id === selected ? "sel" : ""}">
      <td>${new Date(r.started_ns / 1e6).toLocaleTimeString()}</td><td>${esc(r.name)}</td>
      <td>${r.user_id ?? "–"}</td><td>${ms(r.duration_ms)}</td><td>${ms(r.queued_ms)}</td>
      <td>${stageBar(r)}</td>
      <td class="${r.status === "error" ? "err" : ""}">${esc(r.status)}${r.error ? " · " + esc(r.error) : ""}</td>
    </tr>`).join("");
  $("tr-updated").textContent = `更新于 ${new Date().toLocaleTimeString()} · 每 5 秒刷新 · 点一行看 span 瀑布图`;
}
function startTrace() { refreshTrace(); traceTimer ??= setInterval(refreshTrace, 5000); }
function stopTrace() { clearInterval(traceTimer); traceTimer = null; }
async function showTrace(traceId) {
  selected = traceId;
  const spans = await (await fetch(`/dashboard/api/traces/${encodeURIComponent(traceId)}`, {cache: "no-store"})).json();
  const start = Math.min(...spans.map(s => s.started_at_ns));
  const end = Math.max(...spans.map(s => s.started_at_ns + (s.duration_ms || 0) * 1e6));
  const span = Math.max(end - start, 1);
  const depth = {}, byId = Object.fromEntries(spans.map(s => [s.span_id, s]));
  const level = s => depth[s.span_id] ??= s.parent_span_id && byId[s.parent_span_id] ? level(byId[s.parent_span_id]) + 1 : 0;
  $("tr-detail").hidden = false;
  $("tr-title").textContent = `trace ${traceId} · ${ms(span / 1e6)}`;
  $("tr-waterfall").innerHTML = spans.map(s => {
    const left = 100 * (s.started_at_ns - start) / span, width = Math.max(0.4, 100 * (s.duration_ms || 0) * 1e6 / span);
    const attrs = Object.entries(s.attrs).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join("  ");
    const fill = SPAN_STAGE[s.name] ? color(SPAN_STAGE[s.name]) : "var(--accent)";
    return `<div style="padding-left:${level(s) * 14}px" class="${s.status === "error" ? "err" : ""}">${esc(s.kind)} · ${esc(s.name)}</div>
      <div class="track"><span style="left:${left}%;width:${width}%;background:${fill}"></span></div>
      <div>${ms(s.duration_ms)}</div>
      ${attrs ? `<div class="attrs">${esc(attrs)}</div>` : ""}`;
  }).join("");
  refreshTrace();
}
$("tr-rows").onclick = e => { const row = e.target.closest("tr[data-trace]"); if (row) showTrace(row.dataset.trace); };
// Other machines cannot read traces: no tab for them.
fetch("/dashboard/api/summary?limit=1", {cache: "no-store"})
  .then(r => { if (r.status === 403) $("trace-tab").hidden = true; }).catch(() => {});

start();
</script>
</body>
