[project]
name = "wenyuan-model-server"
version = "0.1.0"
description = "Host-side GPU service for embedding and reranking (kept out of Docker: RTX 50-series needs CUDA 12.8+)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.8",
    "sentence-transformers>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
